<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="24" viewBox="0 0 1000 24" fill="none" role="img" aria-label="Divider">
<title>Divider</title>
<style>
.j{font-family:KDJakarta,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.m{font-family:KDPlex,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.spark{animation:spark 5s cubic-bezier(.6,0,.4,1) infinite}
@keyframes spark{0%{transform:translateX(0)}70%,100%{transform:translateX(1160px)}}
.gem{transform-box:fill-box;transform-origin:center;animation:gem 5s ease-in-out infinite}
@keyframes gem{0%,30%,48%,100%{transform:rotate(45deg) scale(1)}38%{transform:rotate(135deg) scale(1.5)}}
</style>
<defs>
  <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#C4835F" stop-opacity="0"/><stop offset=".5" stop-color="#C4835F" stop-opacity=".55"/>
    <stop offset="1" stop-color="#C4835F" stop-opacity="0"/></linearGradient>
  <linearGradient id="spark" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#F26B3F" stop-opacity="0"/><stop offset=".7" stop-color="#F26B3F"/>
    <stop offset=".95" stop-color="#F2B23F"/><stop offset="1" stop-color="#F2B23F" stop-opacity="0"/></linearGradient>
  <filter id="b" x="-20%" y="-300%" width="140%" height="700%"><feGaussianBlur stdDeviation="2.5"/></filter>
</defs>
<rect y="11.5" width="1000" height="1" fill="url(#rule)"/>
<g class="spark"><rect x="-160" y="10" width="160" height="4" rx="2" fill="url(#spark)" filter="url(#b)"/>
  <rect x="-160" y="11.25" width="160" height="1.5" rx=".75" fill="url(#spark)"/></g>
<rect x="495" y="7" width="10" height="10" fill="#F26B3F" transform="rotate(45 500 12)" class="gem"/>
</svg>
