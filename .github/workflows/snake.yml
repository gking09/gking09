# Draws the contribution-graph snake in the README, in the studio's colours,
# and publishes it to the `output` branch. Runs twice a day, on every push to
# main, and on demand from the Actions tab.
name: Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#F2B23F&color_dots=#1c1a21,#4a2a20,#7d3a20,#c4512a,#f26b3f
            dist/snake-light.svg?palette=github-light&color_snake=#141218&color_dots=#ebedf0,#f6d5c6,#eda585,#d96b44,#b33a16

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: Update snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
